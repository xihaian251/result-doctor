        - {name: seed-6, path: output/adult/mlp/tuned/6/stats.json, key: /metrics/test/score, identity: {observed: {path: output/adult/mlp/tuned/6/stats.json, key: /config/seed}}, selector: {kind: best, via: best-epoch}}
